apiVersion: apps/v1
kind: Deployment
metadata:
  name: image-analyzer
  labels:
    app: image-analyzer
spec:
  replicas: 50  # Number of pods
  selector:
    matchLabels:
      app: image-analyzer
  template:
    metadata:
      labels:
        app: image-analyzer
    spec:
      containers:
        - name: image-analyzer
          image: image-analyzer:latest  # Replace with your built image
          ports:
            - containerPort: 8000
          volumeMounts:
            - mountPath: /src/incoming_images  # Mount inside the container
              name: incoming-images-volume
          resources:  # Resource limits (adjust for your system)
            requests:
              memory: "64Mi"
              cpu: "250m"
            limits:
              memory: "128Mi"
              cpu: "500m"
      volumes:
        - name: incoming-images-volume
          hostPath:  # Local storage on your Minikube node
            path: /tmp/image-analyzer/images
            type: DirectoryOrCreate

